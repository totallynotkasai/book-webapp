# DESIGN.md §12.4: every PR runs check, lint, unit tests, build, Playwright E2E and the Android build.
# E2E is split into shards that run side by side: in one job it outgrew the time limit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # DESIGN.md §12.3: the reader route's JavaScript budget (P1-QA-01).
      - run: npm run budget -w @book/web
      - run: npm run build:tester -w @book/web

  # The Android app builds on every PR (P1-MOB-01), as the signed tester APK (D-030). Its artifact
  # installs on a phone for a quick look; narration audio is only in the Tester build workflow's.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run apk:tester -w @book/web
      - uses: actions/upload-artifact@v7
        with:
          name: book-reader-poc-apk
          path: apps/web/build-apk/book-reader-poc.apk
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:tester -w @book/web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -w @book/web playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx -w @book/web playwright install-deps chromium webkit
      - run: npm run test:e2e -w @book/web -- --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7
